commit-format:
  stage: test
  image: alpine:3.20
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache git
  script:
    - |
      fout=0
      for c in $(git rev-list --no-merges \
          "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"); do
        git log -1 --format=%B "$c" > /tmp/msg
        if ! sh .githooks/commit-msg /tmp/msg; then
          echo "  ↳ in commit $(git log -1 --format='%h %s' "$c")"
          fout=1
        fi
      done
      exit $fout